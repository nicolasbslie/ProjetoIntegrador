<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoSpending - Login</title>
  <link rel="stylesheet" href="../style/login.css">
</head>
<body>

  <header>
    <h1>EcoSpending</h1>
  </header>

  <main>
    <div class="card">
      <h2>Login</h2>

      <div class="input-group">
        <input type="text" placeholder="Email ou número" id="email" />
      </div>

      <div class="input-group">
        <input type="password" placeholder="Senha" id="senha" />
      </div>

      <button class="btn btn-primary" onclick="window.location.href='gasto.html'">  Entrar</button>
      
      <button class="btn btn-secondary" onclick="window.location.href='cadastro.html'">Cadastrar</button>
    </div>
  </main>
<script src="../js/login.js"></script>
</body>
</html>
